<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume autocompile preview</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css"
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e1e;
      --bar: #2a2a2a;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #6cb6ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, Segoe UI, sans-serif;
      overflow: hidden;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 12px;
      background: var(--bar);
      border-bottom: 1px solid #000;
      user-select: none;
      flex-wrap: wrap;
    }
    #toolbar button {
      background: #3a3a3a;
      color: var(--fg);
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    #toolbar button:hover { border-color: var(--accent); }
    #zoomLabel { min-width: 4.5em; text-align: center; color: var(--muted); }
    #status { margin-left: auto; color: var(--muted); }
    #status.ok { color: #8fd48f; }
    #status.busy { color: var(--accent); }
    #status.err { color: #f08080; }
    #hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
    body { display: flex; flex-direction: column; }
    #workspace { display: flex; flex: 1; min-height: 0; }
    .pane { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .pane[hidden] { display: none; }
    .pane + .pane { border-left: 1px solid #111; }
    .pane-heading { min-height: 36px; padding: 8px 12px; background: var(--bar); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    select { max-width: min(340px, 55vw); background: #3a3a3a; color: var(--fg); padding: 6px; border: 1px solid #777; border-radius: 4px; font: inherit; }
    button:disabled { opacity: .45; cursor: default !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .empty { padding: 24px; color: var(--muted); }
    .viewport {
      position: relative;
      flex: 1; min-height: 0;
      overflow: auto;
      background: #333;
    }
    .stage {
      position: relative;
      padding: 16px;
      width: max-content;
      min-width: 100%;
      display: flex;
      justify-content: center;
    }
    .page {
      position: relative;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }
    .page canvas {
      display: block;
    }
    /* Transparent selectable text over the canvas */
    .page .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      z-index: 2;
    }
    .page .textLayer span,
    .page .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .page .textLayer ::selection {
      background: rgba(0, 100, 255, 0.35);
    }
    .page .annotationLayer {
      position: absolute;
      inset: 0;
      z-index: 3;
    }
    .page .annotationLayer section {
      position: absolute;
      text-decoration: none;
    }
    .page .annotationLayer a {
      position: absolute;
      font-size: 1em;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .page .annotationLayer .linkAnnotation > a:hover,
    .page .annotationLayer .buttonWidgetAnnotation.pushButton > a:hover {
      opacity: 0.2;
      background: rgba(255, 255, 0, 1);
      box-shadow: 0 2px 10px rgba(255, 255, 0, 1);
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button type="button" id="zoomOut" title="Zoom out (−)">−</button>
    <span id="zoomLabel">100%</span>
    <button type="button" id="zoomIn" title="Zoom in (+)">+</button>
    <button type="button" id="zoomFitWidth" title="Fit width">Fit width</button>
    <button type="button" id="zoomFitHeight" title="Fit height">Fit height</button>
    <button type="button" id="zoomReal" title="Actual print size on this display (1 PDF inch = 1 screen inch)">Real size</button>
    <button type="button" id="compare" aria-pressed="false" disabled>Compare</button>
    <button type="button" id="older" aria-label="Older resume" title="Older resume (Ctrl+Left)" disabled>&larr;</button>
    <label for="history">Past version</label>
    <select id="history" disabled><option>Loading history...</option></select>
    <button type="button" id="newer" aria-label="Newer resume" title="Newer resume (Ctrl+Right)" disabled>&rarr;</button>
    <span id="hint">Ctrl+Left/Right: versions · Ctrl+scroll: zoom both</span>
    <span id="status" role="status">Starting…</span>
  </div>
  <main id="workspace">
    <section class="pane" id="pastPane" aria-label="Past resume" hidden>
      <div class="pane-heading" id="pastTitle">Past resume</div>
      <div class="viewport" id="pastViewport" tabindex="0" aria-label="Past PDF, scroll synchronized"><div class="stage" id="pastStage"><div class="empty">Choose a past version to compare.</div></div></div>
    </section>
    <section class="pane" aria-label="Current resume">
      <div class="pane-heading">Current · live preview</div>
      <div class="viewport" id="viewport" tabindex="0" aria-label="Current PDF, scroll synchronized"><div class="stage" id="stage"></div></div>
    </section>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    const viewportEl = document.getElementById("viewport");
    const stageEl = document.getElementById("stage");
    const zoomLabel = document.getElementById("zoomLabel");
    const statusEl = document.getElementById("status");

    const MIN_SCALE = 0.4;
    const MAX_SCALE = 4;
    const ZOOM_STEP = 1.15;

    const linkService = {
      externalLinkTarget: 2,
      externalLinkRel: "noopener noreferrer nofollow",
      externalLinkEnabled: true,
      addLinkAttributes(element, url, newWindow = true) {
        element.href = url;
        if (newWindow) {
          element.target = "_blank";
          element.rel = "noopener noreferrer nofollow";
        }
      },
      getDestinationHash() {
        return "#";
      },
      getAnchorUrl(hash) {
        return hash || "#";
      },
      async goToDestination() {},
      goToPage() {},
      executeNamedAction() {},
      executeSetOCGState() {},
    };

    let scale = realSizeScale();
    let renderGen = 0;
    const panes = [
      { viewport: viewportEl, stage: stageEl, doc: null, page: null, sequence: 0 },
      { viewport: document.getElementById("pastViewport"), stage: document.getElementById("pastStage"), doc: null, page: null, sequence: 0 },
    ];
    const pastPane = document.getElementById("pastPane");
    const historySelect = document.getElementById("history");
    const compareButton = document.getElementById("compare");
    const olderButton = document.getElementById("older");
    const newerButton = document.getElementById("newer");
    let comparing = false;
    let history = [];
    let publishedHistory = [];
    let historyReady = null;
    let currentReady = null;
    let comparisonRevision = 0;
    let latestSignature = null;
    const signatures = new WeakMap();
    let navigation = Promise.resolve();
    let lastVersion = "";
    let polling = false;
    let running = false;
    let dirty = false;
    let camera = { x: 0, y: 0 };
    let retiredDocs = [];
    let syncing = false;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    /** Browser CSS pixels per inch (usually 96). Measures a real 1in box. */
    function cssPixelsPerInch() {
      const el = document.createElement("div");
      el.style.cssText =
        "position:absolute;left:-9999px;top:0;width:1in;height:1in;padding:0;margin:0;border:0;";
      document.body.appendChild(el);
      const px = el.offsetWidth || 96;
      el.remove();
      return px;
    }

    /**
     * pdf.js scale where 1 PDF point (1/72 in) = 1 CSS inch / 72.
     * That is "Actual Size" / print size as the browser understands inches.
     */
    function realSizeScale() {
      return cssPixelsPerInch() / 72;
    }

    function updateZoomLabel() {
      // 100% = real/print size on this display
      const pct = Math.round((scale / realSizeScale()) * 100);
      zoomLabel.textContent = pct + "%";
    }

    function fitWidthScale(page) {
      const base = page.getViewport({ scale: 1 });
      const pad = 32;
      const avail = Math.max(200, viewportEl.clientWidth - pad);
      return avail / base.width;
    }

    function fitHeightScale(page) {
      const base = page.getViewport({ scale: 1 });
      const pad = 32;
      const avail = Math.max(200, viewportEl.clientHeight - pad);
      return avail / base.height;
    }

    /** Build canvas + text + annotation layers for page 1 at targetScale. */
    async function buildPage(doc, targetScale, gen) {
      const page = await doc.getPage(1);
      if (gen !== renderGen) return null;

      const dpr = window.devicePixelRatio || 1;
      const viewport = page.getViewport({ scale: targetScale });

      const pageEl = document.createElement("div");
      pageEl.className = "page";
      pageEl.style.width = Math.floor(viewport.width) + "px";
      pageEl.style.height = Math.floor(viewport.height) + "px";

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const renderTask = page.render({ canvasContext: ctx, viewport });
      await renderTask.promise;
      if (gen !== renderGen) return null;

      pageEl.appendChild(canvas);

      // Text layer (select / copy)
      const textLayerDiv = document.createElement("div");
      textLayerDiv.className = "textLayer";
      pageEl.appendChild(textLayerDiv);

      const textLayer = new pdfjsLib.TextLayer({
        textContentSource: page.streamTextContent({ includeMarkedContent: true }),
        container: textLayerDiv,
        viewport,
      });
      await textLayer.render();
      if (gen !== renderGen) return null;

      // Annotation layer (clickable links)
      const annotationLayerDiv = document.createElement("div");
      annotationLayerDiv.className = "annotationLayer";
      pageEl.appendChild(annotationLayerDiv);

      const annotations = await page.getAnnotations({ intent: "display" });
      if (gen !== renderGen) return null;

      if (annotations.length) {
        const annotationLayer = new pdfjsLib.AnnotationLayer({
          div: annotationLayerDiv,
          accessibilityManager: null,
          annotationCanvasMap: null,
          annotationEditorUIManager: null,
          page,
          viewport: viewport.clone({ dontFlip: true }),
          structTreeLayer: null,
        });

        await annotationLayer.render({
          annotations,
          linkService,
          downloadManager: null,
          renderForms: false,
        });
      }

      if (gen !== renderGen) return null;
      return pageEl;
    }

    function applyCamera() {
      syncing = true;
      for (const pane of panes) {
        if (!pane.page || (pane === panes[1] && !comparing)) continue;
        pane.viewport.scrollLeft = pane.page.offsetLeft + camera.x * scale;
        pane.viewport.scrollTop = pane.page.offsetTop + camera.y * scale;
        pane.expectedX = pane.viewport.scrollLeft;
        pane.expectedY = pane.viewport.scrollTop;
      }
      syncing = false;
    }

    // Coalesce rapid zoom, version selection and live reload into one render queue.
    // Only a complete pair at the latest scale is swapped onto the screen.
    async function queueRender() {
      dirty = true;
      ++renderGen;
      if (running) return;
      running = true;
      try {
        while (dirty) {
          dirty = false;
          const gen = renderGen;
          const targetScale = scale;
          const active = panes.filter((p, i) => p.doc && (!i || comparing));
          setStatus("Rendering…", "busy");
          try {
            const pages = await Promise.all(active.map(p => buildPage(p.doc, targetScale, gen)));
            if (gen !== renderGen) continue;
            active.forEach((pane, i) => {
              pane.stage.replaceChildren(pages[i]);
              pane.page = pages[i];
              pane.renderedScale = targetScale;
            });
            applyCamera();
            updateZoomLabel();
            setStatus("Live", "ok");
          } catch (error) {
            console.error(error);
            if (gen === renderGen) setStatus("Render error — try zooming again", "err");
          }
        }
      } finally {
        running = false;
        const retired = retiredDocs;
        retiredDocs = [];
        await Promise.all(retired.map(async doc => {
          await signatures.get(doc)?.catch(() => {});
          await doc.destroy();
        }));
      }
    }

    async function loadPdf(pane, url) {
      const sequence = ++pane.sequence;
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error("PDF HTTP " + response.status);
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await response.arrayBuffer()) }).promise;
      if (sequence !== pane.sequence) { await doc.destroy(); return false; }
      if (pane.doc) retiredDocs.push(pane.doc);
      pane.doc = doc;
      await queueRender();
      return sequence === pane.sequence;
    }

    async function pollVersion() {
      if (polling) return;
      polling = true;
      try {
        const response = await fetch("/version?_=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("Version unavailable");
        const version = (await response.text()).trim();
        if (version && version !== "0" && version !== lastVersion) {
          await loadPdf(panes[0], "/autocompile.pdf?v=" + encodeURIComponent(version));
          lastVersion = version;
          await reconcileHistory();
        }
      } catch (error) {
        console.error(error);
        setStatus("Waiting for PDF…", "busy");
      } finally { polling = false; }
    }

    function updateNavigation() {
      const index = historySelect.selectedIndex;
      olderButton.disabled = !history.length || (comparing && index >= history.length - 1);
      newerButton.disabled = !comparing;
      newerButton.title = comparing && index === 0
        ? "Return to current resume (Ctrl+Right)"
        : "Newer resume (Ctrl+Right)";
      newerButton.setAttribute("aria-label", comparing && index === 0 ? "Close past version preview" : "Newer resume");
      historySelect.disabled = !history.length;
      compareButton.disabled = !history.length;
      compareButton.setAttribute("aria-pressed", String(comparing));
    }

    async function selectHistory() {
      const entry = history[historySelect.selectedIndex];
      if (!entry) return;
      updateNavigation();
      document.getElementById("pastTitle").textContent = entry.name;
      setStatus("Loading past version…", "busy");
      try {
        if (await loadPdf(panes[1], "/history.pdf?id=" + encodeURIComponent(entry.id))) {
          panes[1].historyName = entry.name;
        }
      } catch (error) {
        console.error(error);
        if (historySelect.value === entry.name) setStatus("Could not load past version — select again to retry", "err");
      }
    }

    function setComparison(enabled, loadSelection = true) {
      comparing = enabled && history.length > 0;
      pastPane.hidden = !comparing;
      updateNavigation();
      if (comparing && loadSelection && panes[1].historyName !== historySelect.value) selectHistory();
      queueRender();
    }

    // Compare rendered content rather than PDF bytes: recompilation changes PDF
    // timestamps and IDs even when every visible word and layout stays identical.
    function documentSignature(doc) {
      if (!signatures.has(doc)) signatures.set(doc, (async () => {
        const parts = [];
        for (let number = 1; number <= doc.numPages; number++) {
          const page = await doc.getPage(number);
          const viewport = page.getViewport({ scale: 1 });
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          const context = canvas.getContext("2d", { willReadFrequently: true });
          await page.render({ canvasContext: context, viewport }).promise;
          const digest = await crypto.subtle.digest("SHA-256", context.getImageData(0, 0, canvas.width, canvas.height).data);
          const links = (await page.getAnnotations()).map(a => [a.subtype, a.rect, a.url || a.unsafeUrl || ""]);
          parts.push([canvas.width, canvas.height, Array.from(new Uint8Array(digest)), links]);
          canvas.width = canvas.height = 0;
        }
        return JSON.stringify(parts);
      })());
      return signatures.get(doc);
    }

    async function reconcileHistory() {
      const revision = ++comparisonRevision;
      let entries = publishedHistory;
      const current = panes[0].doc;
      if (entries.length && !current) return;
      if (entries.length && current) {
        const latest = entries[0];
        if (!latestSignature || latestSignature.id !== latest.id) {
          latestSignature = { id: latest.id, promise: (async () => {
            const response = await fetch("/history.pdf?id=" + encodeURIComponent(latest.id), { cache: "no-store" });
            if (!response.ok) throw new Error("History PDF HTTP " + response.status);
            const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await response.arrayBuffer()) }).promise;
            try { return await documentSignature(doc); }
            finally { await doc.destroy(); }
          })() };
        }
        try {
          const [live, published] = await Promise.all([documentSignature(current), latestSignature.promise]);
          if (live === published) entries = entries.slice(1);
        } catch (error) {
          // A failed comparison must not hide a version or prevent navigation.
          console.error(error);
          latestSignature = null;
        }
      }
      if (revision !== comparisonRevision) return;
      const selected = comparing ? historySelect.value : "";
      history = entries;
      historySelect.replaceChildren(...entries.map(entry => {
        const option = document.createElement("option");
        // A Git blob can appear under multiple published names. Selection must
        // identify the publication, otherwise restoring it jumps to the first alias.
        option.value = entry.name;
        option.textContent = entry.name.replace(".pdf", "");
        return option;
      }));
      if (!entries.length) historySelect.add(new Option(publishedHistory.length ? "No earlier distinct version" : "No published PDFs found", ""));
      if (entries.some(entry => entry.name === selected)) historySelect.value = selected;
      if (comparing && !entries.length) setComparison(false);
      updateNavigation();
      if (comparing && historySelect.value !== selected) await selectHistory();
    }

    function moveHistory(delta) {
      // Serialize initial input while history/current PDF are still loading so a
      // quick second press moves exactly once beyond the first selected version.
      navigation = navigation.then(async () => {
        await Promise.all([historyReady, currentReady]);
        if (!panes[0].doc) await pollVersion();
        await reconcileHistory();
        if (!comparing) {
          if (delta > 0 && history.length) setComparison(true);
          return;
        }
        const next = historySelect.selectedIndex + delta;
        if (next < 0) {
          setComparison(false);
          return;
        }
        if (next >= history.length) return;
        historySelect.selectedIndex = next;
        setComparison(true, false);
        await selectHistory();
      }).catch(error => { console.error(error); setStatus("Could not navigate history — try again", "err"); });
    }

    async function refreshHistory() {
      try {
        const response = await fetch("/history", { cache: "no-store" });
        if (!response.ok) throw new Error("History HTTP " + response.status);
        const entries = await response.json();
        if (JSON.stringify(entries) === JSON.stringify(publishedHistory)) return;
        publishedHistory = entries;
        await reconcileHistory();
      } catch (error) {
        if (!history.length) historySelect.replaceChildren(new Option("History unavailable — restart watcher", ""));
        updateNavigation();
      }
    }

    function zoomBy(factor, source = panes[0], clientX, clientY) {
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
      if (next === scale) return;
      const rect = source.viewport.getBoundingClientRect();
      const ax = clientX == null ? source.viewport.clientWidth / 2 : clientX - rect.left;
      const ay = clientY == null ? source.viewport.clientHeight / 2 : clientY - rect.top;
      const pointX = source.page && !running
        ? (source.viewport.scrollLeft + ax - source.page.offsetLeft) / source.renderedScale
        : camera.x + ax / scale;
      const pointY = source.page && !running
        ? (source.viewport.scrollTop + ay - source.page.offsetTop) / source.renderedScale
        : camera.y + ay / scale;
      camera = { x: pointX - ax / next, y: pointY - ay / next };
      scale = next;
      updateZoomLabel();
      queueRender();
    }

    async function fit(mode) {
      if (!panes[0].doc) return;
      const page = await panes[0].doc.getPage(1);
      scale = mode === "width" ? fitWidthScale(page) : mode === "height" ? fitHeightScale(page) : realSizeScale();
      if (comparing && panes[1].doc && mode !== "real") {
        const old = (await panes[1].doc.getPage(1)).getViewport({ scale: 1 });
        scale = Math.min(scale, mode === "width" ? (panes[1].viewport.clientWidth - 32) / old.width : (panes[1].viewport.clientHeight - 32) / old.height);
      }
      camera = { x: -16 / scale, y: -16 / scale };
      queueRender();
    }

    for (const pane of panes) {
      pane.viewport.addEventListener("scroll", () => {
        if (syncing || !pane.page || running) return;
        if (pane.viewport.scrollLeft === pane.expectedX && pane.viewport.scrollTop === pane.expectedY) return;
        camera = {
          x: (pane.viewport.scrollLeft - pane.page.offsetLeft) / pane.renderedScale,
          y: (pane.viewport.scrollTop - pane.page.offsetTop) / pane.renderedScale,
        };
        applyCamera();
      });
      pane.viewport.addEventListener("wheel", event => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        zoomBy(event.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP, pane, event.clientX, event.clientY);
      }, { passive: false });
    }
    document.getElementById("zoomIn").onclick = () => zoomBy(ZOOM_STEP);
    document.getElementById("zoomOut").onclick = () => zoomBy(1 / ZOOM_STEP);
    document.getElementById("zoomFitWidth").onclick = () => fit("width");
    document.getElementById("zoomFitHeight").onclick = () => fit("height");
    document.getElementById("zoomReal").onclick = () => fit("real");
    compareButton.onclick = () => setComparison(!comparing);
    historySelect.onchange = () => { setComparison(true, false); selectHistory(); };
    olderButton.onclick = () => moveHistory(1);
    newerButton.onclick = () => moveHistory(-1);
    window.addEventListener("resize", applyCamera);
    window.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && ["ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        moveHistory(event.key === "ArrowLeft" ? 1 : -1);
        return;
      }
      if (event.target.closest("select, input, textarea, [contenteditable=true]") || event.ctrlKey || event.metaKey || event.altKey) return;
      if (["+", "="].includes(event.key)) { event.preventDefault(); zoomBy(ZOOM_STEP); }
      else if (["-", "_"].includes(event.key)) { event.preventDefault(); zoomBy(1 / ZOOM_STEP); }
      else if (["0", "9", "1"].includes(event.key)) { event.preventDefault(); fit({ "0": "width", "9": "height", "1": "real" }[event.key]); }
    });
    updateZoomLabel();
    historyReady = refreshHistory();
    currentReady = pollVersion();
    setInterval(pollVersion, 800);
    setInterval(refreshHistory, 15000);
  </script>
</body>
</html>
