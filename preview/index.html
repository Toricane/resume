<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume autocompile preview</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css"
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e1e;
      --bar: #2a2a2a;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #6cb6ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, Segoe UI, sans-serif;
      overflow: hidden;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      background: var(--bar);
      border-bottom: 1px solid #000;
      user-select: none;
      flex-wrap: nowrap;
    }
    #toolbar button {
      background: #3a3a3a;
      color: var(--fg);
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    #toolbar button:hover { border-color: var(--accent); }
    #zoomLabel { min-width: 4.5em; text-align: center; color: var(--muted); }
    #status { margin-left: auto; color: var(--muted); }
    #status.ok { color: #8fd48f; }
    #status.busy { color: var(--accent); }
    #status.err { color: #f08080; }
    #hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #viewport {
      position: relative;
      height: calc(100% - 40px);
      overflow: auto;
      background: #333;
    }
    #stage {
      position: relative;
      margin: 16px auto;
      width: max-content;
      min-width: 100%;
      display: flex;
      justify-content: center;
    }
    .page {
      position: relative;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }
    .page canvas {
      display: block;
    }
    /* Transparent selectable text over the canvas */
    .page .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      z-index: 2;
    }
    .page .textLayer span,
    .page .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .page .textLayer ::selection {
      background: rgba(0, 100, 255, 0.35);
    }
    .page .annotationLayer {
      position: absolute;
      inset: 0;
      z-index: 3;
    }
    .page .annotationLayer section {
      position: absolute;
      text-decoration: none;
    }
    .page .annotationLayer a {
      position: absolute;
      font-size: 1em;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .page .annotationLayer .linkAnnotation > a:hover,
    .page .annotationLayer .buttonWidgetAnnotation.pushButton > a:hover {
      opacity: 0.2;
      background: rgba(255, 255, 0, 1);
      box-shadow: 0 2px 10px rgba(255, 255, 0, 1);
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button type="button" id="zoomOut" title="Zoom out (−)">−</button>
    <span id="zoomLabel">100%</span>
    <button type="button" id="zoomIn" title="Zoom in (+)">+</button>
    <button type="button" id="zoomFitWidth" title="Fit width">Fit width</button>
    <button type="button" id="zoomFitHeight" title="Fit height">Fit height</button>
    <button type="button" id="zoomReal" title="Actual print size on this display (1 PDF inch = 1 screen inch)">Real size</button>
    <span id="hint">Ctrl+scroll · select text · click links</span>
    <span id="status">Starting…</span>
  </div>
  <div id="viewport">
    <div id="stage"></div>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    const viewportEl = document.getElementById("viewport");
    const stageEl = document.getElementById("stage");
    const zoomLabel = document.getElementById("zoomLabel");
    const statusEl = document.getElementById("status");

    const MIN_SCALE = 0.4;
    const MAX_SCALE = 4;
    const ZOOM_STEP = 1.15;

    const linkService = {
      externalLinkTarget: 2,
      externalLinkRel: "noopener noreferrer nofollow",
      externalLinkEnabled: true,
      addLinkAttributes(element, url, newWindow = true) {
        element.href = url;
        if (newWindow) {
          element.target = "_blank";
          element.rel = "noopener noreferrer nofollow";
        }
      },
      getDestinationHash() {
        return "#";
      },
      getAnchorUrl(hash) {
        return hash || "#";
      },
      async goToDestination() {},
      goToPage() {},
      executeNamedAction() {},
      executeSetOCGState() {},
    };

    let scale = 1;
    let lastVersion = "";
    let pdfDoc = null;
    let visiblePage = null;
    let renderGen = 0;
    let rendering = false;
    let pendingBytes = null;
    let pendingRenderOpts = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    /** Browser CSS pixels per inch (usually 96). Measures a real 1in box. */
    function cssPixelsPerInch() {
      const el = document.createElement("div");
      el.style.cssText =
        "position:absolute;left:-9999px;top:0;width:1in;height:1in;padding:0;margin:0;border:0;";
      document.body.appendChild(el);
      const px = el.offsetWidth || 96;
      el.remove();
      return px;
    }

    /**
     * pdf.js scale where 1 PDF point (1/72 in) = 1 CSS inch / 72.
     * That is "Actual Size" / print size as the browser understands inches.
     */
    function realSizeScale() {
      return cssPixelsPerInch() / 72;
    }

    function updateZoomLabel() {
      // 100% = real/print size on this display
      const pct = Math.round((scale / realSizeScale()) * 100);
      zoomLabel.textContent = pct + "%";
    }

    function fitWidthScale(page) {
      const base = page.getViewport({ scale: 1 });
      const pad = 32;
      const avail = Math.max(200, viewportEl.clientWidth - pad);
      return avail / base.width;
    }

    function fitHeightScale(page) {
      const base = page.getViewport({ scale: 1 });
      const pad = 32;
      const avail = Math.max(200, viewportEl.clientHeight - pad);
      return avail / base.height;
    }

    /** Build canvas + text + annotation layers for page 1 at targetScale. */
    async function buildPage(doc, targetScale, gen) {
      const page = await doc.getPage(1);
      if (gen !== renderGen) return null;

      const dpr = window.devicePixelRatio || 1;
      const viewport = page.getViewport({ scale: targetScale });

      const pageEl = document.createElement("div");
      pageEl.className = "page";
      pageEl.style.width = Math.floor(viewport.width) + "px";
      pageEl.style.height = Math.floor(viewport.height) + "px";

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const renderTask = page.render({ canvasContext: ctx, viewport });
      await renderTask.promise;
      if (gen !== renderGen) return null;

      pageEl.appendChild(canvas);

      // Text layer (select / copy)
      const textLayerDiv = document.createElement("div");
      textLayerDiv.className = "textLayer";
      pageEl.appendChild(textLayerDiv);

      const textLayer = new pdfjsLib.TextLayer({
        textContentSource: page.streamTextContent({ includeMarkedContent: true }),
        container: textLayerDiv,
        viewport,
      });
      await textLayer.render();
      if (gen !== renderGen) return null;

      // Annotation layer (clickable links)
      const annotationLayerDiv = document.createElement("div");
      annotationLayerDiv.className = "annotationLayer";
      pageEl.appendChild(annotationLayerDiv);

      const annotations = await page.getAnnotations({ intent: "display" });
      if (gen !== renderGen) return null;

      if (annotations.length) {
        const annotationLayer = new pdfjsLib.AnnotationLayer({
          div: annotationLayerDiv,
          accessibilityManager: null,
          annotationCanvasMap: null,
          annotationEditorUIManager: null,
          page,
          viewport: viewport.clone({ dontFlip: true }),
          structTreeLayer: null,
        });

        await annotationLayer.render({
          annotations,
          linkService,
          downloadManager: null,
          renderForms: false,
        });
      }

      if (gen !== renderGen) return null;
      return pageEl;
    }

    /** Atomic swap — no stacked canvases, no delayed fade leftovers. */
    function showPage(pageEl, scrollLeft, scrollTop) {
      stageEl.replaceChildren(pageEl);
      visiblePage = pageEl;
      viewportEl.scrollLeft = scrollLeft;
      viewportEl.scrollTop = scrollTop;
    }

    async function renderCurrent(opts = {}) {
      const {
        fitWidth = false,
        fitHeight = false,
        realSize = false,
        preserveScroll = true,
      } = opts;
      if (!pdfDoc) return;

      const gen = ++renderGen;
      rendering = true;
      setStatus("Rendering…", "busy");

      const scrollLeft = viewportEl.scrollLeft;
      const scrollTop = viewportEl.scrollTop;

      try {
        const page = await pdfDoc.getPage(1);
        if (realSize) scale = realSizeScale();
        if (fitWidth) scale = fitWidthScale(page);
        if (fitHeight) scale = fitHeightScale(page);

        const pageEl = await buildPage(pdfDoc, scale, gen);
        if (!pageEl || gen !== renderGen) return;

        updateZoomLabel();
        showPage(
          pageEl,
          preserveScroll ? scrollLeft : viewportEl.scrollLeft,
          preserveScroll ? scrollTop : viewportEl.scrollTop
        );
        setStatus("Live", "ok");
      } catch (err) {
        if (gen === renderGen) {
          console.error(err);
          setStatus("Render error", "err");
        }
      } finally {
        if (gen === renderGen) {
          rendering = false;
          await flushPending();
        }
      }
    }

    async function flushPending() {
      if (pendingBytes) {
        const next = pendingBytes;
        pendingBytes = null;
        await loadPdfBytes(next);
        return;
      }
      if (pendingRenderOpts) {
        const opts = pendingRenderOpts;
        pendingRenderOpts = null;
        await renderCurrent(opts);
      }
    }

    async function loadPdfBytes(bytes) {
      if (rendering) {
        pendingBytes = bytes;
        return;
      }

      rendering = true;
      setStatus("Updating…", "busy");
      const gen = ++renderGen;
      const scrollLeft = viewportEl.scrollLeft;
      const scrollTop = viewportEl.scrollTop;
      const firstLoad = !visiblePage;

      try {
        const loadingTask = pdfjsLib.getDocument({ data: bytes.slice(0) });
        const doc = await loadingTask.promise;
        if (gen !== renderGen) return;

        pdfDoc = doc;

        if (firstLoad) {
          scale = realSizeScale();
        }

        const pageEl = await buildPage(doc, scale, gen);
        if (!pageEl || gen !== renderGen) return;

        updateZoomLabel();
        showPage(pageEl, scrollLeft, scrollTop);
        setStatus("Live", "ok");
      } catch (err) {
        if (gen === renderGen) {
          console.error(err);
          setStatus("Load error", "err");
        }
      } finally {
        if (gen === renderGen) {
          rendering = false;
          await flushPending();
        }
      }
    }

    async function fetchPdf(version) {
      const r = await fetch("/autocompile.pdf?v=" + encodeURIComponent(version), {
        cache: "no-store",
      });
      if (!r.ok) throw new Error("PDF HTTP " + r.status);
      return new Uint8Array(await r.arrayBuffer());
    }

    async function pollVersion() {
      try {
        const r = await fetch("/version?_=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return;
        const v = (await r.text()).trim();
        if (!v || v === lastVersion) return;
        lastVersion = v;
        const bytes = await fetchPdf(v);
        await loadPdfBytes(bytes);
      } catch (err) {
        console.error(err);
        setStatus("Waiting for PDF…", "busy");
      }
    }

    function queueRender(opts) {
      if (rendering) {
        pendingRenderOpts = opts;
        return Promise.resolve();
      }
      return renderCurrent(opts);
    }

    function zoomBy(factor, anchorX, anchorY) {
      const prev = scale;
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
      if (Math.abs(next - prev) < 1e-6) return;

      const rect = viewportEl.getBoundingClientRect();
      const ax = anchorX == null ? rect.width / 2 : anchorX - rect.left;
      const ay = anchorY == null ? rect.height / 2 : anchorY - rect.top;
      const contentX = (viewportEl.scrollLeft + ax) / prev;
      const contentY = (viewportEl.scrollTop + ay) / prev;

      scale = next;
      updateZoomLabel();

      queueRender({ preserveScroll: false }).then(() => {
        viewportEl.scrollLeft = contentX * scale - ax;
        viewportEl.scrollTop = contentY * scale - ay;
      });
    }

    document.getElementById("zoomIn").addEventListener("click", () => zoomBy(ZOOM_STEP));
    document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / ZOOM_STEP));
    document.getElementById("zoomFitWidth").addEventListener("click", () => {
      queueRender({ fitWidth: true, preserveScroll: false });
    });
    document.getElementById("zoomFitHeight").addEventListener("click", () => {
      queueRender({ fitHeight: true, preserveScroll: false });
    });
    document.getElementById("zoomReal").addEventListener("click", () => {
      queueRender({ realSize: true, preserveScroll: false });
    });

    viewportEl.addEventListener(
      "wheel",
      (e) => {
        if (!e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
        zoomBy(factor, e.clientX, e.clientY);
      },
      { passive: false }
    );

    window.addEventListener("keydown", (e) => {
      if (e.key === "+" || e.key === "=") {
        e.preventDefault();
        zoomBy(ZOOM_STEP);
      } else if (e.key === "-" || e.key === "_") {
        e.preventDefault();
        zoomBy(1 / ZOOM_STEP);
      } else if (e.key === "0") {
        e.preventDefault();
        queueRender({ fitWidth: true, preserveScroll: false });
      } else if (e.key === "9") {
        e.preventDefault();
        queueRender({ fitHeight: true, preserveScroll: false });
      } else if (e.key === "1") {
        e.preventDefault();
        queueRender({ realSize: true, preserveScroll: false });
      }
    });

    updateZoomLabel();
    pollVersion();
    setInterval(pollVersion, 800);
  </script>
</body>
</html>
